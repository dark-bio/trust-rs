name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: cargo build --verbose

      - name: Install cargo-hack
        run: cargo install cargo-hack

      - name: Build environment combinations
        run: cargo hack build --feature-powerset

      - name: Test environment combinations
        run: cargo hack test --feature-powerset

  wasm:
    name: Build on WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-hack
        run: cargo install cargo-hack

      - name: Build environment combinations
        run: cargo hack build --feature-powerset --target wasm32-unknown-unknown

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-hack
      - run: cargo hack clippy --feature-powerset --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: cargo doc --all-features --no-deps

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the public API against the published release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  roots:
    uses: ./.github/workflows/roots.yml
