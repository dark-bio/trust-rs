[package]
name = "darkbio-trust"
version = "0.5.0"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Dark Bio ecosystem roots of trust"
repository = "https://github.com/dark-bio/trust-rs"
documentation = "https://docs.rs/darkbio-trust"
categories = ["cryptography", "authentication"]
keywords = ["ark", "dark-bio", "attestation", "cwt"]
license = "BSD-3-Clause"
edition = "2024"
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
release = []
staging = []
develop = []

[dependencies]
darkbio-crypto = { version = "0.18.2", features = ["cwt", "rsa"] }
hex = "0.4"
thiserror = "2.0"
